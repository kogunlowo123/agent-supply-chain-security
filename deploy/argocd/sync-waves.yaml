apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/kogunlowo123/agent-supply-chain-security.git
    targetRevision: HEAD
    path: deploy/helm/api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: supply-chain
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-agent-runtime
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/kogunlowo123/agent-supply-chain-security.git
    targetRevision: HEAD
    path: deploy/helm/agent-runtime
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: supply-chain
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
