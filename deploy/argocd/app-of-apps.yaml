apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kogunlowo123/agent-supply-chain-security.git
    targetRevision: HEAD
    path: deploy/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
