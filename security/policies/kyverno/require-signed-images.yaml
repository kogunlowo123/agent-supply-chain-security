apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images must be signed with cosign before they can be deployed.
      This policy verifies sigstore/cosign signatures for all images in the supply-chain namespace.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - supply-chain
      verifyImages:
        - imageReferences:
            - "us-central1-docker.pkg.dev/*/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://accounts.google.com"
                    issuer: "https://accounts.google.com"
                    rekor:
                      url: https://rekor.sigstore.dev
