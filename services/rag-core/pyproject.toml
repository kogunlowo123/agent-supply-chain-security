[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supply-chain-rag-core"
version = "0.1.0"
description = "Agent Supply Chain Security — RAG Core Service"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "opensearch-py>=2.4.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
